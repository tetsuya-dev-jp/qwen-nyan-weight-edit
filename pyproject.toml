[project]
name = "qwen-nyan-weight-edit"
version = "0.1.0"
description = "A reproducible Qwen3.5-0.8B sentence-ending weight-editing experiment"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "torch>=2.10,<3",
    "transformers==5.14.1",
    "huggingface-hub>=1.0,<2",
    "safetensors>=0.7,<1",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.10,<4", "numpy>=2,<3"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
