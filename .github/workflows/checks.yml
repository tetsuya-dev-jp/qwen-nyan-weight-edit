name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv venv
      - run: uv pip install -r pyproject.toml --torch-backend=cpu
      - run: uv run --no-sync python test_scoring.py
      - run: uv run --no-sync python test_publication.py
